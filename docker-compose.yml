services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: gasmapocho
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasmapocho"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ../eureka-server
    ports:
      - "8761:8761"

  config-server:
    build: ../config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Repo de GitHub con la configuracion de los servicios; se puede cambiar desde el archivo .env
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-https://github.com/Sophia-1827/DAW-II_Grupo09_gasmapocho_config-repo}
    depends_on:
      eureka-server:
        condition: service_started

  ms-usuarios:
    build: ../ms-usuarios
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Dentro de Docker los servicios llaman al Config Server por su nombre, sin esperar a que se registre en Eureka
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gasmapocho_usuarios
      DB_USER: gasmapocho
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy

  ms-balones:
    build: ../ms-balones
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Dentro de Docker los servicios llaman al Config Server por su nombre, sin esperar a que se registre en Eureka
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gasmapocho_balones
      DB_USER: gasmapocho
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-movimientos:
    build: ../ms-movimientos
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Dentro de Docker los servicios llaman al Config Server por su nombre, sin esperar a que se registre en Eureka
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gasmapocho_movimientos
      DB_USER: gasmapocho
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-reportes:
    build: ../ms-reportes
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Dentro de Docker los servicios llaman al Config Server por su nombre, sin esperar a que se registre en Eureka
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started

  api-gateway:
    build: ../api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Dentro de Docker los servicios llaman al Config Server por su nombre, sin esperar a que se registre en Eureka
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started

volumes:
  postgres-data:
